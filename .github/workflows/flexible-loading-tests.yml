name: Flexible loading regression checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'pandas>=2.0.0'
      - name: Compile changed Python files
        run: python -m py_compile bvx_auswertung_streamlit.py verlade_varianten_flex.py tests/test_flexible_loading.py
      - name: Flexible loading regression tests
        run: python -m unittest discover -s tests -p 'test_flexible_loading.py' -v
