name: Flexible loading regression checks

on:
  push:
    branches: [feature/flexible-lanes-width-20261030, feature/optionale-seitenbalance-20261030, hotfix/streamlit-flex-module-import-20261030]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile changed Python files
        run: python -m py_compile bvx_auswertung_streamlit.py verlade_varianten_flex.py tests/test_flexible_loading.py tests/test_flexible_loading_integration.py
      - name: Flexible loading unit regression tests
        run: python -m unittest discover -s tests -p 'test_flexible_loading.py' -v
      - name: Full planner integration regression tests
        run: python -m unittest discover -s tests -p 'test_flexible_loading_integration.py' -v
